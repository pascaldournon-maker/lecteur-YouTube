
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vidéo – Modèle atomique</title>

<style>
body {
  margin: 0;
  padding: 15px;
  background: #f5f5f5;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 850px;
  margin: auto;
}

#player {
  width: 100%;
  aspect-ratio: 16 / 9;
}

#player iframe {
  width: 100%;
  height: 100%;
}

.controls {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 12px;
}

button {
  padding: 11px 16px;
  background: #245a91;
  color: white;
  border: none;
  border-radius: 7px;
  cursor: pointer;
  font-size: 15px;
}

button:disabled {
  opacity: 0.5;
}

#progress {
  flex: 1;
  min-width: 40px;
  cursor: pointer;
}

#time {
  font-size: 13px;
  white-space: nowrap;
}

p {
  text-align: center;
  color: #333;
}
</style>
</head>

<body>

<div class="container">

  <div id="player"></div>

  <div class="controls">

    <button id="play" disabled>▶ Lire</button>

    <input
      type="range"
      id="progress"
      min="0"
      max="109"
      step="0.1"
      value="0"
      disabled
    >

    <span id="time">0:00 / 1:49</span>

  </div>

  <p>Visionnage de l'extrait : 0:00 à 1:49</p>

</div>

<script>

var player;
var timer;
var duration = 109;
var dragging = false;

function onYouTubeIframeAPIReady() {

  player = new YT.Player('player', {

    videoId: '8olA8cobrrw',

    playerVars: {
      controls: 0,
      playsinline: 1,
      rel: 0,
      cc_load_policy: 0,
      iv_load_policy: 3,
      disablekb: 1
    },

    events: {

      onReady: function(event) {

        document.getElementById('play').disabled = false;
        document.getElementById('progress').disabled = false;

        // Demande de désactivation des sous-titres
        try {
          event.target.unloadModule('captions');
          event.target.setOption('captions', 'track', {});
        } catch(error) {
          console.log('Réglage des sous-titres indisponible');
        }

        timer = setInterval(updatePlayer, 200);
      },

      onStateChange: function(event) {

        var button = document.getElementById('play');

        if (event.data === YT.PlayerState.PLAYING) {
          button.textContent = 'Ⅱ Pause';
        } else {
          button.textContent = '▶ Lire';
        }

      }

    }

  });

}

// Lecture et pause
document.getElementById('play').addEventListener('click', function() {

  if (!player) return;

  if (player.getPlayerState() === YT.PlayerState.PLAYING) {
    player.pauseVideo();
  } else {
    player.playVideo();
  }

});

// Déplacement de la barre
var progress = document.getElementById('progress');

progress.addEventListener('pointerdown', function() {
  dragging = true;
});

progress.addEventListener('input', function() {

  document.getElementById('time').textContent =
    formatTime(this.value) + ' / 1:49';

  if (player && dragging) {
    player.seekTo(Number(this.value), false);
  }

});

function finishSeeking() {

  if (!player || !dragging) return;

  player.seekTo(Number(progress.value), true);
  dragging = false;

}

progress.addEventListener('change', finishSeeking);
progress.addEventListener('pointerup', finishSeeking);
progress.addEventListener('pointercancel', finishSeeking);

// Actualisation du lecteur
function updatePlayer() {

  if (!player || typeof player.getCurrentTime !== 'function') return;

  if (player.getPlayerState() !== YT.PlayerState.PLAYING) return;

  var current = player.getCurrentTime();

  // Fin de l'extrait : retour au début
  if (current >= duration) {
    player.seekTo(0, true);
    return;
  }

  if (!dragging) {

    progress.value = current;

    document.getElementById('time').textContent =
      formatTime(current) + ' / 1:49';

  }

}

function formatTime(seconds) {

  var s = Math.floor(Number(seconds));

  return Math.floor(s / 60) + ':' +
    String(s % 60).padStart(2, '0');

}

// Chargement de l'API YouTube
var tag = document.createElement('script');

tag.src = 'https://www.youtube.com/iframe_api';

document.head.appendChild(tag);

</script>

</body>
</html>
